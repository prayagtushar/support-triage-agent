services:
  db:
    image: pgvector/pgvector:pg16
    container_name: triage-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../api
    container_name: triage-api
    env_file:
      - ../api/.env
    environment:
      # Inside the network the database is a service name, not localhost.
      DATABASE_URL: postgresql://postgres:postgres@db:5432/triage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:

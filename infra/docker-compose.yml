services:
  db:
    image: pgvector/pgvector:pg16
    container_name: triage-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

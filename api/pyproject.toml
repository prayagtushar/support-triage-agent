[project]
name = "triage-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
    "psycopg[binary,pool]>=3.2.0",
    "httpx>=0.28.1",
    "pyarrow>=18.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# The default suite must stay fast and offline. Anything needing a database,
# a network call, or a provider API key is marked and excluded here; run those
# deliberately with `-m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: needs a live database, network, or provider API key",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # pyupgrade
    "B",     # bugbear
    "ASYNC", # async correctness
    "S",     # bandit
    "T20",   # no stray print() in application code
    "RUF",
]
ignore = [
    "S101",  # asserts are how pytest works
]

[tool.ruff.lint.per-file-ignores]
# Scripts are operator tools: printing is their interface.
"scripts/*" = ["T20"]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true
